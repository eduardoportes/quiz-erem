<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Tech Quiz - Resultados</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #f4f1f7; color: #222; }
    h1 { color: #3b1a4f; }
    .barra { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    button, a.btn {
      background: #3b1a4f; color: #fff; border: 0; border-radius: 8px;
      padding: 10px 16px; font-size: 1rem; cursor: pointer; text-decoration: none;
    }
    button.perigo { background: #a32626; }
    .tabela { overflow-x: auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    table { border-collapse: collapse; width: 100%; min-width: 640px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e6e0ec; }
    th { background: #3b1a4f; color: #fff; }
    .vazio { padding: 24px; text-align: center; color: #666; }
    small { color: #555; }
  </style>
</head>
<body>
  <h1>Resultados do Black Tech Quiz</h1>
  <p><small>Os resultados ficam salvos neste navegador, neste computador. Para guardar de forma permanente, baixe o arquivo.</small></p>

  <div class="barra">
    <a class="btn" href="index.html">Voltar ao quiz</a>
    <button id="btnCsv">Baixar CSV (Excel)</button>
    <button id="btnJson">Baixar JSON</button>
    <button id="btnLimpar" class="perigo">Apagar tudo</button>
  </div>

  <div class="tabela">
    <table>
      <thead>
        <tr>
          <th>Data</th><th>Grupo</th><th>Turma</th><th>Acertos</th>
          <th>Erros</th><th>Aproveit.</th><th>Pontos</th>
        </tr>
      </thead>
      <tbody id="corpo"></tbody>
    </table>
    <div id="vazio" class="vazio" hidden>Nenhum resultado salvo ainda.</div>
  </div>

  <script>
    const CHAVE = "blackTechQuizResultados";

    function carregar() {
      try { return JSON.parse(localStorage.getItem(CHAVE) || "[]"); }
      catch (e) { return []; }
    }

    function desenhar() {
      const dados = carregar();
      const corpo = document.getElementById("corpo");
      corpo.innerHTML = "";
      document.getElementById("vazio").hidden = dados.length > 0;
      dados.forEach((r) => {
        const tr = document.createElement("tr");
        [r.data, r.grupo, r.turma, r.acertos, r.erros, r.aproveitamento + "%", r.pontuacao]
          .forEach((valor) => {
            const td = document.createElement("td");
            td.textContent = valor; // textContent evita injeção de HTML
            tr.appendChild(td);
          });
        corpo.appendChild(tr);
      });
    }

    function baixar(nome, conteudo, tipo) {
      const blob = new Blob([conteudo], { type: tipo });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = nome; a.click();
      URL.revokeObjectURL(url);
    }

    const escapar = (v) => '"' + String(v).replace(/"/g, '""') + '"';

    document.getElementById("btnCsv").addEventListener("click", () => {
      const dados = carregar();
      const cab = ["Data", "Grupo", "Turma", "Respondidas", "Acertos", "Erros", "Aproveitamento (%)", "Pontuação"];
      const linhas = dados.map((r) =>
        [r.data, r.grupo, r.turma, r.respondidas, r.acertos, r.erros, r.aproveitamento, r.pontuacao]
          .map(escapar).join(";"));
      // BOM para o Excel abrir os acentos corretamente
      baixar("black-tech-quiz-resultados.csv", "\uFEFF" + [cab.map(escapar).join(";"), ...linhas].join("\n"), "text/csv;charset=utf-8");
    });

    document.getElementById("btnJson").addEventListener("click", () => {
      baixar("black-tech-quiz-resultados.json", JSON.stringify(carregar(), null, 2), "application/json");
    });

    document.getElementById("btnLimpar").addEventListener("click", () => {
      if (confirm("Apagar todos os resultados salvos neste navegador? Baixe o CSV antes, se precisar.")) {
        localStorage.removeItem(CHAVE);
        desenhar();
      }
    });

    desenhar();
  </script>
</body>
</html>
